# PORTABLE specification: direct dependencies only, deliberately unpinned.
# For the exact versions the recorded results were produced with (one machine), see
# reproducibility/environment_snapshot_macos-arm64.txt. That file is a snapshot of an
# existing environment, not an installation recipe for other platforms.
#
# gemmi and scipy were added after the first scaffold: Meeko's receptor preparation
# needs gemmi, and several analyses import scipy. The tests use the standard-library
# unittest (python -m unittest discover tests); no extra test dependency is required.
#
# Order matters: conda-forge packages install before the pip block.
# Never `pip install vina`.
name: cdk2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit
  - vina
  - pdbfixer
  - numpy
  - scipy
  - gemmi
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyterlab
  - pip
  - pip:
      - meeko
      - posebusters
      - chembl_webresource_client
